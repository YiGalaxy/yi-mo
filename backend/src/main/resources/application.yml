server:
  # 只监听本机。亿墨没有认证，绑定 0.0.0.0 意味着同局域网任何人都能读写你的稿件
  address: 127.0.0.1
  # 用 18080 而不是 8080：本地开发服务扎堆在 8000-9000 段，容易被别的项目占用。
  # 端口只在启动时用一次（随后自动打开浏览器），所以不需要好记
  port: 18080

spring:
  application:
    name: yimo

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 端口 3308 对应 docker-compose.yml 里映射出来的端口
    url: jdbc:mysql://127.0.0.1:3308/yimo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: yimo
    password: yimo_dev_2026
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # 前端构建产物会拷到这里
  web:
    resources:
      static-locations: classpath:/static/

yimo:
  # 启动后自动打开浏览器。无头环境（服务器、Docker）设为 false
  open-browser: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发时打印 SQL，排查数据问题最快的方法
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.yimo: DEBUG
  file:
    name: ${user.home}/.yimo/logs/yimo.log
